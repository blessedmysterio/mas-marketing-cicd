[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-marketing"
version = "1.0.0"
description = "Multi-agent simulation of marketing situations on scale-free consumer networks"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "networkx>=3.2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "flake8>=7"]

[project.scripts]
mas-sim = "mas_marketing.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
